name: Build

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main

  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types:
      - completed

env:
  REGISTRY: ghcr.io

jobs:
  # Build docker images with docker compose and push to github registry
  build-push-to-registry:
    name: Docker compose build and push to ghcr
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: prod
    permissions:
      contents: read
      packages: write

    steps:
      - name: Git checkout
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create env file
        env:
          SERVER_ENV_PROD: ${{ secrets.SERVER_ENV_PROD }}
        run: |
          if [ -z "$SERVER_ENV_PROD" ]; then
            echo "::error::Secret SERVER_ENV_PROD is empty. Add it in Settings > Environments > prod > Secrets before this workflow can build/push images." >&2
            exit 1
          fi
          printf '%s\n' "$SERVER_ENV_PROD" > .env

      - name: Build images
        run: docker compose -f docker-compose.prod.yml build

      - name: Push image to container registry
        run: docker compose -f docker-compose.prod.yml push
